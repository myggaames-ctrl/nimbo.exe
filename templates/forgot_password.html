<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Cocina — Recuperar contraseña</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --bg:        #0a0a0f;
    --surface:   #111118;
    --surface2:  #1a1a24;
    --border:    #22222e;
    --accent:    #f97316;
    --accent2:   #fb923c;
    --text:      #e8e8f0;
    --muted:     #6b6b80;
    --green:     #22c55e;
    --radius:    12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
  }

  .logo-mark {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 2px;
  }

  .logo-name {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .input-group { margin-bottom: 16px; }

  .input-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }

  .input:focus { border-color: var(--accent); }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }

  .btn-primary:hover { background: var(--accent2); }

  .success-box {
    background: rgba(34,197,94,0.12);
    border: 1px solid var(--green);
    color: var(--green);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--muted);
    text-decoration: none;
  }

  .back-link:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-mark">Mi Cocina</div>
  <div class="logo-name">Recuperar contraseña</div>

  {% if mensaje %}
  <div class="success-box">{{ mensaje }}</div>
  {% else %}
  <div class="subtitle">Ingresa el correo del administrador y te enviaremos un enlace para restablecer la contraseña. El enlace expira en 1 hora.</div>
  {% endif %}

  {% if not mensaje %}
  <form method="POST" action="{{ url_for('forgot_password') }}">
    <div class="input-group">
      <label class="input-label">Correo</label>
      <input class="input" type="email" name="email" autocomplete="email" required autofocus>
    </div>
    <button class="btn-primary" type="submit">Enviar enlace de recuperación</button>
  </form>
  {% endif %}

  <a class="back-link" href="{{ url_for('login') }}">← Volver a iniciar sesión</a>
</div>

</body>
</html>
